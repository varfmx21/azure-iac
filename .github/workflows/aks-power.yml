name: aks-power (stop / start / status)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do with the AKS cluster"
        type: choice
        options: [stop, start, status]
        default: stop

permissions:
  id-token: write
  contents: read

env:
  RG: rg-forgetask-baseline
  AKS: aks-forgetask-baseline

jobs:
  power:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run action
        run: |
          case "${{ inputs.action }}" in
            stop)   az aks stop   -g "$RG" -n "$AKS" ;;
            start)  az aks start  -g "$RG" -n "$AKS" ;;
            status) az aks show   -g "$RG" -n "$AKS" --query "powerState.code" -o tsv ;;
          esac
