# Put this file in: forgetask/src/main/resources/application-azure.properties
# Activated with SPRING_PROFILES_ACTIVE=azure. It overrides ONLY the Oracle datasource settings of
# application.properties. The JDBC URL comes from the env var SPRING_DATASOURCE_URL.
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Baseline only: let Hibernate create the tables/sequences/schema for the 3 auth entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=false
