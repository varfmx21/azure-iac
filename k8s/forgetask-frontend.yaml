apiVersion: v1
kind: Service
metadata:
  name: forgetask-frontend-service
spec:
  type: ClusterIP
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app: forgetask-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgetask-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgetask-frontend
  template:
    metadata:
      labels:
        app: forgetask-frontend
        version: v1
    spec:
      containers:
        - name: forgetask-frontend
          image: ${ACR_LOGIN_SERVER}/forgetask-frontend:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_USE_PROXY
              value: "true"
            - name: BACKEND_INTERNAL_URL
              value: "http://forgetask-service:8080"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "384Mi" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
