apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgetask-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: forgetask-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgetask-frontend-service
                port:
                  number: 3000
