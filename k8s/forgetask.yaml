# Backend (Spring Boot) running with the "azure" Spring profile (PostgreSQL).
apiVersion: v1
kind: Service
metadata:
  name: forgetask-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: forgetask
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgetask-sa
  namespace: forgetask
  annotations:
    azure.workload.identity/client-id: "a0e510bb-f2c2-4846-a3d0-80a55af93283"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: forgetask-kv-provider
  namespace: forgetask
spec:
  provider: azure
  secretObjects: 
    - secretName: forgetask-app-secrets
      type: Opaque
      data:
        - objectName: JWT-SECRET
          key: JWT_SECRET
        - objectName: DB-PASSWORD
          key: DB_PASSWORD
        - objectName: DB-URL
          key: DB_URL
        - objectName: DB-USER
          key: DB_USER
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "a0e510bb-f2c2-4846-a3d0-80a55af93283"
    tenantId: "c66b6765-b794-4a2b-84ed-845b341c086a"
    keyvaultName: "kv-forgetask-secrets"
    objects: |
      array:
        - |
          objectName: JWT-SECRET
          objectType: secret
        - |
          objectName: DB-PASSWORD
          objectType: secret
        - |
          objectName: DB-URL
          objectType: secret
        - |
          objectName: DB-USER
          objectType: secret

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgetask-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgetask
  template:
    metadata:
      labels:
        app: forgetask
        version: v1
        azure.workload.identity/use: "true" 
    spec:
      serviceAccountName: forgetask-sa
      containers:
        - name: forgetask
          image: ${ACR_LOGIN_SERVER}/forgetask:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "azure"
            - name: SPRING_DATASOURCE_URL
              valueFrom: { secretKeyRef: { name: forgetask-app-secrets, key: DB_URL } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: forgetask-app-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: forgetask-app-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: forgetask-app-secrets, key: JWT_SECRET } }
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_VERSION
              value: "${IMAGE_TAG}"
            - name: TELEGRAM_BOT_ENABLED
              value: "false"
            - name: LLM_PROVIDER
              value: "groq"
            - name: LLM_API_KEY
              value: ""
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
      volumes:
          - name: secrets-store-inline
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: "forgetask-kv-provider"